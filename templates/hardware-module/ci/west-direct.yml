# SPDX-License-Identifier: Apache-2.0
# West manifest for a module that has no organisation manifest above it: the
# module repository is the manifest repository and pins Crux, and every other
# component it needs, by full SHA. In the module's repository this file takes
# the place of ci/west.yml. See README.md.
manifest:
  version: "1.2"

  remotes:
    - name: crux
      url-base: https://github.com/wonny-labs
    # The organisation's internal host, used by the example below.
    #
    # - name: acme
    #   url-base: https://git.example/scm/acme

  projects:
    # Replace the placeholder with the full SHA of the Crux commit that the
    # module is built and tested against. Crux brings Zephyr and its modules at
    # the revisions it pins. To move to another Crux, change this SHA.
    - name: crux-pilot
      remote: crux
      revision: 0123456789abcdef0123456789abcdef01234567
      import: true

    # Another component the module's tests need, pinned the same way. west
    # crux-pins lists it as PRODUCT.
    #
    # - name: vendor-runtime
    #   remote: acme
    #   revision: 0123456789abcdef0123456789abcdef01234567 # v1.0.0
    #   path: modules/vendor-runtime

  self:
    path: acme-hw
