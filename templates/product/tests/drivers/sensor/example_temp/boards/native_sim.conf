# Both native_sim platforms need a file of their own: native_sim/native reads native_sim.conf and
# native_sim/native/64 reads native_sim_64.conf, and the two files are the same.
# The emulator of the part, and Zephyr's emulated I2C controller that native_sim already has.
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
