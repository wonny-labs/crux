# SPDX-License-Identifier: Apache-2.0

common:
  tags:
    - product
    - driver
    - sensor
tests:
  # Unit tests of the driver against its emulator. They run on the simulator, in CI and on a
  # developer's machine in the Dev Container, and they need no hardware.
  product.drivers.sensor.example_temp.emul:
    harness: ztest
    platform_allow:
      - native_sim
      - native_sim/native/64
  # The same driver on a board with the part wired. The scenario is gated on a Twister fixture:
  # without --device-testing, and without the fixture on the command line or in a hardware map
  # entry, Twister builds the image and does not run it. A run on a board is a hardware operation
  # and needs authorisation for the task. A Twister launch of the hardware type flashes on every
  # launch and is not a safe route. See src/hardware_test.c.
  product.drivers.sensor.example_temp.hardware:
    harness: ztest
    harness_config:
      fixture: example_temp_wired
    platform_allow:
      - mimxrt1060_evk@B/mimxrt1062/qspi
      - example_rt1062/mimxrt1062
