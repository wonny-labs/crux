manifest:
  version: "1.2"
  # Stacks for the secure management work. They are off by default, so that an
  # ordinary workspace fetches no GPLv3 stack. See patches/zephyr/README.md.
  # The crux-reliance group is off by default for the same reason: an ordinary
  # workspace does not fetch the GPLv2 Reliance Edge source.
  # The crux-boot group holds MCUboot (Apache-2.0). It is off by default only to
  # keep an ordinary workspace's fetch small.
  group-filter: [-crux-secure-management, -crux-reliance, -crux-boot]
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: wolfssl
      url-base: https://github.com/wolfSSL
    - name: tuxera
      url-base: https://github.com/tuxera
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      repo-path: zephyr
      revision: 41d10b59730406bbab4ca9f1fbbe9e96aafb4966 # v4.5.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nxp
          - littlefs
          - fatfs
    # MCUboot follows the revision in Zephyr's own west.yml at the tag above.
    # Zephyr puts mcuboot in its own bootloader group, which its group-filter keeps
    # active, so a name-allowlist entry would fetch it unless Crux also filtered that
    # group. It is a plain project in Crux's own optional group instead.
    - name: mcuboot
      remote: zephyrproject-rtos
      revision: 725d63c9d5bc1bb572d802e7a768daf504186daf
      path: bootloader/mcuboot
      groups:
        - crux-boot
    # The crypto libraries follow the revisions in Zephyr's own west.yml at the tag above: Mbed TLS
    # 4.1.1 and TF-PSA-Crypto 1.1.1 (Zephyr's fork tags zephyr_mbedtls_v4.1.1 and
    # zephyr_tf-psa-crypto_v1.1.1), which hold the fixes of the advisories of 7 July 2026
    # (docs/dependency-review-mbed-tls-4.1.1.md). A pin that differs from Zephyr's needs a security pin
    # review under ADR-0006, which scripts/test-psa-crypto.sh checks.
    - name: mbedtls
      remote: zephyrproject-rtos
      revision: c43f34b93797e81fd0257c30004dcd0ae332ae51
      path: modules/crypto/mbedtls
      groups:
        - crux-secure-management
    - name: tf-psa-crypto
      remote: zephyrproject-rtos
      revision: 765af96a20a2b408474dcd950372ba9af4d26b62
      path: modules/crypto/tf-psa-crypto
      groups:
        - crux-secure-management
    - name: wolfssl
      remote: wolfssl
      revision: 3c5eead44904df64e6a5a1f4ebdce377d35a849a # v5.9.4-stable
      path: modules/crypto/wolfssl
      groups:
        - crux-secure-management
    - name: wolfssh
      remote: wolfssl
      revision: 8221e4ee48c93da6cea3325a91de2ecc00ae5f56 # v1.6.0-stable
      path: modules/crypto/wolfssh
      groups:
        - crux-secure-management
    - name: wolfpsa
      remote: wolfssl
      repo-path: wolfPSA
      revision: 55ae0ec58cd2ef4c528f44e8466095550c16ca8a # v5.9.4
      path: modules/crypto/wolfpsa
      groups:
        - crux-secure-management
    - name: reliance-edge
      remote: tuxera
      revision: 6706984258c5bb61c778fe8ca2edd04b559efb78 # v3.0
      path: modules/fs/reliance-edge
      groups:
        - crux-reliance
  self:
    path: crux
    west-commands: scripts/west-commands.yml
