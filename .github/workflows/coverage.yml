name: coverage-advisory

# Advisory test-coverage measurement. It reports how much of the component sources the Host and
# native_sim tests execute. It has no threshold, is not a required check and uploads nothing
# outside GitHub. Pull requests do not start it, so their CI time is unchanged. It is the
# coverage part of the nightly tier (docs/ci.md): its two jobs run the checks of the jobs
# coverage-host and coverage-native-sim in scripts/ci/checks.toml.
# tests/build/test_coverage_workflow.py keeps it advisory.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# A newer run on the same ref supersedes an older one: only the latest figures matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: host coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          # No job installs from packages.microsoft.com; an outage there would fail the update.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -q 'packages\.microsoft\.com' {} \; -printf 'Removing unused apt source %p\n' -delete
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1 llvm-18=1:18.1.3-1ubuntu1
          python3 -m venv "${RUNNER_TEMP}/crux-tools"
          "${RUNNER_TEMP}/crux-tools/bin/pip" install cmake==3.28.4 ninja==1.11.1 gcovr==8.3
          echo "${RUNNER_TEMP}/crux-tools/bin" >> "$GITHUB_PATH"

      # A build or test failure fails the job: an empty report must not pass for a measurement.
      - name: Build and run the Host tests with coverage
        run: scripts/coverage-host.sh run

      # Only the report step may fail for tool reasons without failing the job.
      - name: Create the Host coverage report
        id: report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          scripts/coverage-host.sh report
          cat build/coverage/host/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Flag a missing Host coverage report
        if: ${{ !cancelled() && steps.report.outcome == 'failure' }}
        run: |
          echo "::warning::The Host coverage report could not be created; see the report step log."
          echo "Host coverage report unavailable: the coverage tool failed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Host coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/coverage/host/report/
            build/coverage/host/ctest-junit.xml
          retention-days: 14
          if-no-files-found: warn

  native-sim:
    name: native_sim coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CRUX_WORKSPACE: ${{ github.workspace }}
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      CRUX_PYTHON: ${{ github.workspace }}/../crux-tools/bin/python
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../crux-cache/sdk/zephyr-sdk-1.0.1
      CI_HOST_PACKAGES: >-
        build-essential gcc-multilib ca-certificates device-tree-compiler file gperf git
        libmagic1 libsdl2-dev pkg-config python3-dev python3-tk wget xz-utils
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The set-up steps below are those of zephyr.yml.
      - name: List host packages from the signed index
        id: apt_list
        run: |
          # No job installs from packages.microsoft.com; an outage there would fail the update.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -q 'packages\.microsoft\.com' {} \; -printf 'Removing unused apt source %p\n' -delete
          sudo apt-get update
          empty="$(mktemp -d)"
          sudo apt-get install -y -qq --print-uris --no-install-recommends \
            -o Acquire::ForceHash=SHA256 -o "Dir::Cache::archives=$empty" \
            $CI_HOST_PACKAGES > "$RUNNER_TEMP/apt-uris"
          echo "key=zephyr-apt-ubuntu-24.04-$(sha256sum < "$RUNNER_TEMP/apt-uris" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded host packages
        id: apt_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/crux-apt
          key: ${{ steps.apt_list.outputs.key }}
          restore-keys: zephyr-apt-ubuntu-24.04-

      - name: Install Zephyr host packages
        run: |
          archives="$HOME/.cache/crux-apt"
          python3 crux/scripts/verify-apt-cache.py "$RUNNER_TEMP/apt-uris" "$archives"
          mkdir -p "$archives/partial"
          sudo apt-get install -y -o "Dir::Cache::archives=$archives" --no-install-recommends \
            $CI_HOST_PACKAGES
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Save downloaded host packages
        if: steps.apt_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/crux-apt
          key: ${{ steps.apt_list.outputs.key }}

      - name: Install pinned Python tools
        run: |
          python -m venv "$GITHUB_WORKSPACE/../crux-tools"
          "$GITHUB_WORKSPACE/../crux-tools/bin/pip" install --disable-pip-version-check \
            cmake==3.28.4 ninja==1.11.1 west==1.4.0 gcovr==8.3
          echo "$GITHUB_WORKSPACE/../crux-tools/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Zephyr workspace and install SDK
        working-directory: crux
        env:
          CRUX_GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap-zephyr.sh --install-sdk

      # A build or test failure fails the job: an empty report must not pass for a measurement.
      - name: Run the native_sim suites with coverage
        working-directory: crux
        run: scripts/coverage-native-sim.sh run

      # Only the report step may fail for tool reasons without failing the job. It runs after
      # a failed suite too, to report the suites that did run.
      - name: Create the native_sim coverage report
        id: report
        if: ${{ !cancelled() }}
        working-directory: crux
        continue-on-error: true
        run: |
          scripts/coverage-native-sim.sh report
          cat build/coverage/native-sim/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Flag a missing native_sim coverage report
        if: ${{ !cancelled() && steps.report.outcome == 'failure' }}
        run: |
          echo "::warning::The native_sim coverage report could not be created; see the report step log."
          echo "native_sim coverage report unavailable: the coverage tool failed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the native_sim coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-native-sim-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crux/build/coverage/native-sim/report/
            crux/build/coverage/native-sim/twister-*/twister.json
          retention-days: 14
          if-no-files-found: warn
