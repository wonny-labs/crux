name: zephyr-software

# A thin wrapper: scripts/ci/run-tier.sh picks and runs the checks of the tier (docs/ci.md).
# ci.yml calls it for pull requests, merges and the nightly tier, and its ci-gate job needs it
# (docs/ci.md#merge-gate). It can also run alone by hand.
on:
  workflow_call:
    inputs:
      tier:
        description: "Tier to run; empty runs the tier of the event (docs/ci.md)"
        type: string
        default: ""
      base:
        description: "Compare the change with this ref or commit; empty leaves the change unknown (docs/ci.md)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (docs/ci.md)"
        type: choice
        options: [full, fast, nightly]
        default: full
      base:
        description: "Compare the change with this ref or commit; empty leaves the change unknown (docs/ci.md)"
        type: string
        default: ""

permissions:
  contents: read

env:
  CRUX_CI_BASE: ${{ inputs.base }}

jobs:
  # Each shard runs the checks of its job zephyr-<shard> in scripts/ci/checks.toml.
  # tests/build/test_zephyr_ci_shards.py keeps the matrix and those jobs equal. The longest
  # shards come first, so that they start first when runners are short (docs/ci-zephyr-shards.md).
  shard:
    name: zephyr ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [emmc, runtime, controller, integration, storage, io, system, file]
    env:
      CRUX_WORKSPACE: ${{ github.workspace }}
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      CRUX_PYTHON: ${{ github.workspace }}/../crux-tools/bin/python
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../crux-cache/sdk/zephyr-sdk-1.0.1
      TIER: ${{ inputs.tier || 'auto' }}
      # The board of the board-generic scripts (scripts/lib/board.sh, tests/README.md#board-input).
      # scripts/ci/checks.toml gives the Zephyr jobs the same default for other CI systems.
      CRUX_BOARD_TARGET: mimxrt1060_evk@B//qspi
      CI_HOST_PACKAGES: >-
        build-essential gcc-multilib ca-certificates device-tree-compiler file gperf git
        libmagic1 libsdl2-dev pkg-config python3-dev python3-tk wget xz-utils
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan the checks of this tier
        id: plan
        working-directory: crux
        run: |
          scripts/ci/run-tier.sh "$TIER" --job "zephyr-${{ matrix.shard }}" --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job "zephyr-${{ matrix.shard }}" --count)" >> "$GITHUB_OUTPUT"

      # Mirror downloads stalled for up to ten minutes in about one job in six. The cache is
      # only as trusted as its contents, so it is checked against the signed index before use.
      - name: List host packages from the signed index
        id: apt_list
        if: steps.plan.outputs.checks != '0'
        run: |
          # No job installs from packages.microsoft.com; an outage there would fail the update.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -q 'packages\.microsoft\.com' {} \; -printf 'Removing unused apt source %p\n' -delete
          sudo apt-get update
          empty="$(mktemp -d)"
          sudo apt-get install -y -qq --print-uris --no-install-recommends \
            -o Acquire::ForceHash=SHA256 -o "Dir::Cache::archives=$empty" \
            $CI_HOST_PACKAGES > "$RUNNER_TEMP/apt-uris"
          echo "key=zephyr-apt-ubuntu-24.04-$(sha256sum < "$RUNNER_TEMP/apt-uris" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded host packages
        id: apt_restore
        if: steps.plan.outputs.checks != '0'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/crux-apt
          key: ${{ steps.apt_list.outputs.key }}
          restore-keys: zephyr-apt-ubuntu-24.04-

      - name: Install Zephyr host packages
        if: steps.plan.outputs.checks != '0'
        run: |
          archives="$HOME/.cache/crux-apt"
          python3 crux/scripts/verify-apt-cache.py "$RUNNER_TEMP/apt-uris" "$archives"
          mkdir -p "$archives/partial"
          sudo apt-get install -y -o "Dir::Cache::archives=$archives" --no-install-recommends \
            $CI_HOST_PACKAGES
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Save downloaded host packages
        if: steps.plan.outputs.checks != '0' && steps.apt_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/crux-apt
          key: ${{ steps.apt_list.outputs.key }}

      - name: Install pinned Python tools
        if: steps.plan.outputs.checks != '0'
        run: |
          python -m venv "$GITHUB_WORKSPACE/../crux-tools"
          "$GITHUB_WORKSPACE/../crux-tools/bin/pip" install --disable-pip-version-check \
            cmake==3.28.4 ninja==1.11.1 west==1.4.0 clang-format==18.1.8
          echo "$GITHUB_WORKSPACE/../crux-tools/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Zephyr workspace and install SDK
        if: steps.plan.outputs.checks != '0'
        working-directory: crux
        env:
          CRUX_GITHUB_TOKEN: ${{ github.token }}
        # Also records the build folder names of CRUX_BOARD_TARGET for the upload paths below.
        run: |
          scripts/bootstrap-zephyr.sh --install-sdk
          bash -c 'source scripts/lib/board.sh && crux_board_env "$CRUX_BOARD_TARGET"' >> "$GITHUB_ENV"

      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux
        run: scripts/ci/run-tier.sh "$TIER" --job "zephyr-${{ matrix.shard }}"

      # Avoid repeated glob traversals through large Twister build trees.
      - name: Collect Twister evidence
        if: always() && steps.plan.outputs.checks != '0'
        shell: bash
        # Listing each file in the upload path exceeded the runner's limit on one
        # environment value, so the files are copied to one folder instead.
        run: |
          set -euo pipefail
          mkdir -p crux/build/twister-evidence
          cd crux/build
          for directory in zephyr/twister-*; do
            [ -d "$directory" ] || continue
            find "$directory" -type f \( \
              -name 'production_*.h' -o \
              -name '*.log' -o -name '*.err' -o \
              -name 'CMakeConfigureLog.yaml' -o \
              -name 'CMakeCache.txt' -o -name 'compile_commands.json' -o \
              -path '*/zephyr/.config' -o \
              -path '*/zephyr/zephyr.map' -o \
              -path '*/zephyr/zephyr.dts' \
            \) -print0
            find "$directory" -maxdepth 1 -type f \( -name '*.json' -o -name '*.xml' \) -print0
          done | LC_ALL=C sort -zu | xargs -0 -r cp --parents -t twister-evidence

      - name: Upload Zephyr reports and raw logs
        if: always() && steps.plan.outputs.checks != '0'
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crux/build/ci/
            # Keeps the original zephyr/twister-* layout under twister-evidence.
            crux/build/twister-evidence/
            # Direct cross-build outputs: do not scan every EVKB generated header tree.
            crux/build/zephyr/*/*.log
            crux/build/zephyr/*/*.err
            crux/build/zephyr/*/CMakeFiles/**/*.log
            crux/build/zephyr/*/CMakeFiles/CMakeConfigureLog.yaml
            crux/build/zephyr/*/CMakeCache.txt
            crux/build/zephyr/*/compile_commands.json
            crux/build/zephyr/*/zephyr/.config
            crux/build/zephyr/*/zephyr/zephyr.dts
            crux/build/evidence/*inputs*.json
            crux/build/system-resource-evidence/
            crux/build/system-consumer/ctest-junit.xml
            crux/build/zephyr/system-${{ env.CRUX_BOARD_TAG }}/zephyr/.config
            crux/build/zephyr/system-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.dts
            crux/build/zephyr/system-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.map
            crux/build/evidence/integrated-smoke/
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/compile_commands.json
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/provenance.json
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/rom.json
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/ram.json
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/zephyr/.config
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.dts
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.map
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.elf
            crux/build/zephyr/integrated-smoke-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.bin
            crux/build/system-composition/*/build.log
            crux/build/serial-consumer/ctest-junit.xml
            crux/build/zephyr/serial-${{ env.CRUX_BOARD_TAG }}/zephyr/zephyr.map
            crux/build/zephyr/serial-${{ env.CRUX_BOARD_TAG }}/zephyr/.config
            crux/build/zephyr/native_sim_time/compile_commands.json
