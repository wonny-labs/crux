  # One check that passes only when every shard passed.
  zephyr:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: test "$SHARD_RESULT" = success
