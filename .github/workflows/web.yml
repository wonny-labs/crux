name: web

# A thin wrapper: scripts/ci/run-tier.sh picks and runs the checks of the tier (docs/ci.md).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "samples/web/**"
      - "tests/management_api/**"
      - "scripts/check-management-api.sh"
      - "scripts/ci/**"
      - ".github/workflows/web.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "web/**"
      - "samples/web/**"
      - "tests/management_api/**"
      - "scripts/check-management-api.sh"
      - "scripts/ci/**"
      - ".github/workflows/web.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (docs/ci.md)"
        type: choice
        options: [full, fast, nightly]
        default: full

# Supersede only older runs for this PR and workflow. Main/manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TIER: ${{ inputs.tier || 'auto' }}

jobs:
  specification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/api/lint/package.json
      - name: Run the checks of this tier
        run: scripts/ci/run-tier.sh "$TIER" --job web-specification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-specification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 14
          if-no-files-found: warn

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/package.json
      - name: Run the checks of this tier
        run: scripts/ci/run-tier.sh "$TIER" --job web-client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crux-web-sbom
          path: web/crux-web.cdx.json
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRUX_SCREENSHOTS: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/package.json
      - name: Run the checks of this tier
        run: scripts/ci/run-tier.sh "$TIER" --job web-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: crux-web-screenshots
          path: screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: crux-web-failures
          path: web/build/e2e-failures
          if-no-files-found: ignore

  angular:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: samples/web/angular/package.json
      - name: Run the checks of this tier
        run: scripts/ci/run-tier.sh "$TIER" --job web-angular
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-angular-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: crux-angular-failures
          path: web/build/e2e-failures
          if-no-files-found: ignore
