name: psa-crypto

# Qualifies TF-PSA-Crypto (Issue #142) on Linux Host and native_sim, and compiles it for RT1060-EVKB, and
# runs the management composition on it (Issue #242). A
# default workflow must not select the GPL stacks, so wolfPSA does not run here: see
# docs/psa-crypto-qualification.md. It takes only the two Apache-2.0 option projects by name.

# Documentation changes do not run it, except to a review record that the pin check reads.
# A thin wrapper: scripts/ci/run-tier.sh picks and runs the checks of the tier (docs/ci.md).
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/dependency-review-*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/dependency-review-*.md"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (docs/ci.md)"
        type: choice
        options: [full, fast, nightly]
        default: full
      base:
        description: "Compare the change with this ref or commit; empty leaves the change unknown (docs/ci.md)"
        type: string
        default: ""

# Supersede only older runs for this PR and workflow. Main/manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CRUX_CI_BASE: ${{ inputs.base }}

jobs:
  # Each runs one PSA job of scripts/ci/checks.toml.
  psa-crypto:
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job: [psa-management, psa-crypto]
    env:
      CC: clang-18
      CXX: clang++-18
      CRUX_WORKSPACE: ${{ github.workspace }}
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      CRUX_PYTHON: ${{ github.workspace }}/../crux-tools/bin/python
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../crux-cache/sdk/zephyr-sdk-1.0.1
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-pilot
        run: |
          scripts/ci/run-tier.sh "$TIER" --job "${{ matrix.job }}" --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job "${{ matrix.job }}" --count)" >> "$GITHUB_OUTPUT"

      - name: Install host packages
        if: steps.plan.outputs.checks != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang-18=1:18.1.3-1ubuntu1 device-tree-compiler file \
            gperf git libclang-rt-18-dev=1:18.1.3-1ubuntu1 libmagic1 pkg-config python3-dev wget xz-utils

      - name: Install pinned Python tools
        if: steps.plan.outputs.checks != '0'
        run: |
          python -m venv "$GITHUB_WORKSPACE/../crux-tools"
          "$GITHUB_WORKSPACE/../crux-tools/bin/pip" install --disable-pip-version-check \
            cmake==3.28.4 ninja==1.11.1 west==1.4.0
          echo "$GITHUB_WORKSPACE/../crux-tools/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned workspace with the TF-PSA-Crypto projects, and install the SDK
        if: steps.plan.outputs.checks != '0'
        env:
          CRUX_GITHUB_TOKEN: ${{ github.token }}
        run: |
          west init -l crux-pilot
          west config manifest.project-filter -- +mbedtls,+tf-psa-crypto
          cd crux-pilot
          scripts/bootstrap-zephyr.sh --install-sdk

      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-pilot
        run: scripts/ci/run-tier.sh "$TIER" --job "${{ matrix.job }}"

      - name: Upload logs and reports
        if: always() && steps.plan.outputs.checks != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crux-pilot/build/ci/
            crux-pilot/build/psa-crypto/*.txt
            crux-pilot/build/psa-crypto/*.log
            crux-pilot/build/psa-crypto/twister/twister.json
            crux-pilot/build/tls-offload-probe/*/*.json
            crux-pilot/build/tls-offload-probe/*/*.txt
            crux-pilot/build/native-composition/*/*.log
            crux-pilot/build/native-composition/*/*.txt
            crux-pilot/build/native-composition/*/*.json
            crux-pilot/build/web/https-*-results*
            crux-pilot/build/web-session/*.json
            crux-pilot/build/web-session/*.log
          if-no-files-found: warn
          retention-days: 14
