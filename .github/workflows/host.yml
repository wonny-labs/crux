name: host-foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede only older runs for this PR and workflow. Main/manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_FORMAT: clang-format
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1 clang-tidy-18=1:18.1.3-1ubuntu1 ripgrep
          python3 -m venv "${RUNNER_TEMP}/crux-tools"
          "${RUNNER_TEMP}/crux-tools/bin/pip" install cmake==3.28.4 ninja==1.11.1 clang-format==18.1.8
          echo "${RUNNER_TEMP}/crux-tools/bin" >> "$GITHUB_PATH"
      - name: Configure, build, and test
        run: ./scripts/bootstrap-host.sh
      - name: Validate independent File consumers
        run: |
          cmake -S tests/file_consumer -B build/file-consumers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/file-consumers
      - name: Portable execution consumers
        run: ./scripts/test-portable-execution.sh --host-only
      - name: Logging consumers
        run: ./scripts/test-logging.sh --host-only
      - name: System consumers
        run: ./scripts/test-system.sh --host-only
      - name: Messaging and Serial consumers
        run: |
          ./scripts/test-messaging.sh --host-only
          ./scripts/test-serial.sh --host-only
      - name: Management services consumer
        run: |
          cmake -S tests/mgmt_services_consumer -B build/mgmt-services-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/mgmt-services-consumer --target mgmt_services_consumer_c mgmt_services_consumer_cpp
      - name: Databases
        if: always()
        run: find build -name compile_commands.json | sort
      - name: Superset of the old hand-written list (probe)
        if: always()
        run: |
          python3 scripts/tidy-sources.py list > /tmp/new-list.tsv
          cut -f2 /tmp/new-list.tsv | sort > /tmp/new.txt
          wc -l /tmp/new.txt
          echo "old paths missing from the generated list:"; comm -23 scripts/old90.txt /tmp/new.txt
          echo "end of missing list"
          cut -f1 /tmp/new-list.tsv | sort | uniq -c
      - name: Report-only run (probe)
        if: always()
        run: python3 scripts/tidy-sources.py run --report-only --jobs 4
