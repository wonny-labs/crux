name: host-foundation

# A thin wrapper: scripts/ci/run-tier.sh picks and runs the checks of the tier (docs/ci.md).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (docs/ci.md)"
        type: choice
        options: [full, fast, nightly]
        default: full
      base:
        description: "Compare the change with this ref or commit; empty leaves the change unknown (docs/ci.md)"
        type: string
        default: ""

# Supersede only older runs for this PR and workflow. Main/manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CRUX_CI_BASE: ${{ inputs.base }}

jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_FORMAT: clang-format
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan the checks of this tier
        id: plan
        run: |
          scripts/ci/run-tier.sh "$TIER" --job host --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job host --count)" >> "$GITHUB_OUTPUT"
      - name: Install host tools
        if: steps.plan.outputs.checks != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1 clang-tidy-18=1:18.1.3-1ubuntu1 ripgrep
          python3 -m venv "${RUNNER_TEMP}/crux-tools"
          "${RUNNER_TEMP}/crux-tools/bin/pip" install \
            cmake==3.28.4 ninja==1.11.1 clang-format==18.1.8 west==1.4.0 pyyaml==6.0.3
          echo "${RUNNER_TEMP}/crux-tools/bin" >> "$GITHUB_PATH"
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        run: scripts/ci/run-tier.sh "$TIER" --job host
      - name: Upload host test reports and raw logs
        if: always() && steps.plan.outputs.checks != '0'
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/
            build/linux/sanitize/ctest-junit.xml
            build/linux/sanitize/Testing/Temporary/LastTest.log
            build/linux/debug/samples/controller/host/controller.log
            build/linux/debug/ctest-junit.xml
            build/linux/debug/Testing/Temporary/LastTest.log
            build/thread-only/ctest-junit.xml
            build/thread-only/compile_commands.json
            build/thread-only/consumer.map
            build/sync-only/ctest-junit.xml
            build/sync-only/compile_commands.json
            build/sync-only/consumer.map
            build/execution-firmware-host/ctest-junit.xml
            build/execution-firmware-host/consumer-boundary.json
            build/execution-firmware-host/compile_commands.json
            build/execution-runtime-host/ctest-junit.xml
            build/execution-runtime-host/compile_commands.json
            build/messaging-consumer/ctest-junit.xml
            build/logging-consumer/ctest-junit.xml
            build/system-consumer/ctest-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # The other Host jobs of scripts/ci/checks.toml, one runner each.
  host-other:
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job: [host-build-tests-large, host-build-tests]
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_FORMAT: clang-format
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan the checks of this tier
        id: plan
        run: |
          scripts/ci/run-tier.sh "$TIER" --job "${{ matrix.job }}" --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job "${{ matrix.job }}" --count)" >> "$GITHUB_OUTPUT"
      - name: Install host tools
        if: steps.plan.outputs.checks != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1 clang-tidy-18=1:18.1.3-1ubuntu1 ripgrep
          python3 -m venv "${RUNNER_TEMP}/crux-tools"
          "${RUNNER_TEMP}/crux-tools/bin/pip" install \
            cmake==3.28.4 ninja==1.11.1 clang-format==18.1.8 west==1.4.0 pyyaml==6.0.3
          echo "${RUNNER_TEMP}/crux-tools/bin" >> "$GITHUB_PATH"
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        run: scripts/ci/run-tier.sh "$TIER" --job "${{ matrix.job }}"
      - name: Upload the check reports
        if: always() && steps.plan.outputs.checks != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 14
          if-no-files-found: warn
