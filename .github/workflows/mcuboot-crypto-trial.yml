name: mcuboot-crypto-trial

# TEMPORARY. A one-off CI run of tests/target/compare-mcuboot-crypto-backends.sh on this branch, to
# collect the size comparison for plan decision D9 (docs/plans/mcuboot-crypto-backend-comparison.md).
# It is removed again before the pull request is merged, so it never enters main. It builds only: no
# hardware, no key, no manifest change. The setup steps are those of the shard job of zephyr.yml.
on:
  push:
    branches: [m8-mcuboot-crypto-comparison]

permissions:
  contents: read

jobs:
  trial:
    name: mcuboot crypto backend size comparison
    runs-on: ubuntu-24.04
    env:
      CRUX_WORKSPACE: ${{ github.workspace }}
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      CRUX_PYTHON: ${{ github.workspace }}/../crux-tools/bin/python
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../crux-cache/sdk/zephyr-sdk-1.0.1
      CRUX_BOARD_TARGET: mimxrt1060_evk@B//qspi
      CI_HOST_PACKAGES: >-
        build-essential gcc-multilib ca-certificates device-tree-compiler file gperf git
        libmagic1 libsdl2-dev pkg-config python3-dev python3-tk wget xz-utils
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-pilot
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zephyr host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $CI_HOST_PACKAGES

      - name: Install pinned Python tools
        run: |
          python -m venv "$GITHUB_WORKSPACE/../crux-tools"
          "$GITHUB_WORKSPACE/../crux-tools/bin/pip" install --disable-pip-version-check \
            cmake==3.28.4 ninja==1.11.1 west==1.4.0 clang-format==18.1.8
          echo "$GITHUB_WORKSPACE/../crux-tools/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Zephyr workspace and install SDK
        working-directory: crux-pilot
        env:
          CRUX_GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap-zephyr.sh --install-sdk

      - name: Compare the MCUboot ECDSA P-256 crypto backends (software-only, build only)
        working-directory: crux-pilot
        run: tests/target/compare-mcuboot-crypto-backends.sh

      - name: Upload the comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcuboot-crypto-comparison-${{ github.run_id }}
          include-hidden-files: true
          path: |
            crux-pilot/build/zephyr/mcuboot-crypto/*.log
            crux-pilot/build/zephyr/mcuboot-crypto/*.json
            crux-pilot/build/zephyr/mcuboot-crypto/summary.md
            crux-pilot/build/zephyr/mcuboot-crypto/*/mcuboot/zephyr/.config
