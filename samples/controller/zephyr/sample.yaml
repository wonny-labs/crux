sample:
  name: Crux reference controller
  description: >-
    The basic periodic controller scenario: 20 cycles of Time observation on a 100 ms grid,
    then a completion line. The other configurations in this folder are board probes and
    are not part of this sample entry.
common:
  tags: [crux, sample, controller]
  platform_allow:
    - native_sim/native/64
    - mimxrt1060_evk@B/mimxrt1062/qspi
  integration_platforms:
    - native_sim/native/64
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "controller composition=zephyr init=0"
      - "CONTROLLER_COMPLETE cycles=20"
tests:
  crux.sample.controller.basic:
    extra_args: []
