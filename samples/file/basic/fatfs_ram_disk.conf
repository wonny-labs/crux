# Scenario .fatfs_ram_disk: the Crux File FatFs simulator provider on a RAM disk
# (fatfs_ram_disk.overlay). Build with
#   -DEXTRA_CONF_FILE=fatfs_ram_disk.conf -DEXTRA_DTC_OVERLAY_FILE=fatfs_ram_disk.overlay

# Switch off the default provider and its storage from prj.conf.
CONFIG_CRUX_FILE_SIMULATOR=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=n
CONFIG_FLASH_SIMULATOR=n
CONFIG_FLASH_MAP=n
CONFIG_FLASH=n

# FatFs as the provider requires it: long names of at least 127 characters, reentrancy, and no
# automatic format on mount.
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_CRUX_FILE_FATFS_SIMULATOR=y
