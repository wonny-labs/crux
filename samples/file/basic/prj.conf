CONFIG_STD_C17=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y

# Default scenario (.simulator): the Crux File VFS simulator provider over LittleFS on the
# native_sim flash simulator. fatfs_ram_disk.conf switches these off and selects the other provider.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_CRUX_FILE_SIMULATOR=y
