sample:
  name: Hello Crux
  description: >-
    The smallest Zephyr application that uses Crux. It links the Time target of the Crux
    module, makes one public call and prints a ready line.
common:
  tags: [crux, sample, time]
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "Hello from Crux on zephyr"
      - "Crux Time: unset"
      - "CRUX_HELLO_READY composition=zephyr"
tests:
  crux.sample.hello_crux: {}
