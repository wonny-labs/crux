# RT1060-EVK Rev B management image, Mbed TLS profile (docs/rt1060-mbed-management-image.md). The Mbed profile and the
# PSA settings come from the three files that CMakeLists.txt names in EXTRA_CONF_FILE (tests/native/tls_offload_probe/
# mbed.conf, management_composition/profile-psa.conf and mbed-threading.conf). This file holds the rest. Every size is
# a first, unmeasured choice, and the document says which.
CONFIG_STD_C17=y
# As the native images of the services set it: the Zephyr kernel heap, which the HTTP server and the file system use.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_CRUX_PILOT_MODULE=y
# The main thread derives the first account's password (PBKDF2) on its stack when the test form is on.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SHELL=n

# The Mbed profile beside what mbed.conf holds, as tests/zephyr/web_compile/mbedtls.conf compiles it for this board.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_MBEDTLS_PK_WRITE_C=y

# Crux Logging, which the security events write to: the deferred UART backend on LPUART1. printk goes through it, so
# there is one writer and the console lines and the events are in order.
CONFIG_PRINTK=y
CONFIG_CRUX_LOGGING=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_BACKEND_SHOW_LEVEL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_PRINTK=y
CONFIG_STDOUT_CONSOLE=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_CONSOLE_SUBSYS=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n

# Ethernet and the TLS socket layer on the target's own network stack. The address is static (main.c).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_TCP_ISN_RFC6528=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_PHY_MONITOR_PERIOD=500
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=24
CONFIG_ZVFS_EVENTFD=y

# Network buffers, as the RT1060-EVKB bench image sizes them for its declared sessions (docs/rt1060-bench-network-buffers.md,
# paper rules, not measured on a board). This image serves HTTPS only, which is the smaller load, so these are the
# bench's numbers taken whole and not a new sizing.
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=5840
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=5840
CONFIG_NET_BUF_RX_COUNT=1024
CONFIG_NET_BUF_TX_COUNT=768
CONFIG_NET_PKT_RX_COUNT=192
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_ETH_NXP_ENET_RX_BUFFERS=6
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
CONFIG_CRUX_WEB_BACKLOG=4

# Entropy: the i.MX RT TRNG through its driver. No test generator, no fake entropy: CMakeLists.txt refuses both.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y

# Web adapter, HTTPS only. The server thread runs each TLS handshake inside accept, and the stack of an Mbed TLS handshake
# on this board is not measured: 16,384 B is a generous first choice, and a board run reads the real figure.
CONFIG_CRUX_WEB=y
CONFIG_CRUX_WEB_PORT=443
CONFIG_HTTP_SERVER_STACK_SIZE=16384

# The management services, from the Zephyr module under their own symbols. They select the Crux Thread, Sync and Time
# symbols themselves (ADR-0004 C6), so none is named here.
CONFIG_CRUX_ACCESS=y
CONFIG_CRUX_CONFIG_SERVICE=y
CONFIG_CRUX_MGMT_STATUS=y
CONFIG_CRUX_NETWORK_SETTINGS=y
# The apply port that applies nothing: a PUT to /api/v1/network answers 501, and nothing is applied to the interface.
CONFIG_CRUX_NETWORK_SETTINGS_NO_APPLY=y
CONFIG_CRUX_TLS_CERTIFICATE=y
CONFIG_CRUX_FILE_SERVICE=y
CONFIG_CRUX_REBOOT=y
CONFIG_CRUX_WEB_SESSION=y
CONFIG_CRUX_WEB_MANAGEMENT=y

# Crux capabilities that the services read and the reset path uses.
CONFIG_CRUX_NETIF=y
CONFIG_CRUX_SYSTEM=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

# The file backend: the File service on FatFs over a RAM disk of 512 KiB in SDRAM (ram_disk.overlay), with no card driver
# in the image. Nothing persists across a reset: accounts, keys, the certificate and the events are made again at each
# boot. src/medium.c formats the RAM disk when it mounts blank, and never anything else.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_CRUX_FILE_FATFS_RT1060_RAM_DISK=y
# Zephyr turns the SD card driver and the USDHC host on when the board's devicetree has the card's node (it has), so
# this image turns them off: with them off it has no card to mount or format.
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_IMX_USDHC=n
