# RT1170-EVK boot composition (application image). PROPOSED STARTING VALUES from the RT1170
# design note "RT1170-EVK boot composition: memory-map choices". They are Inference, not adopted
# by the owner, and are to be corrected by the first CI build. Nothing was built or run for this
# board. Mirrors the RT1060-EVK Rev B file of the same name.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y
