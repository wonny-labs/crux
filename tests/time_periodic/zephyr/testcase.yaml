tests:
  crux.time_periodic.scenario:
    tags: [crux, scenario]
    platform_allow:
      - native_sim/native/64
      - mimxrt1060_evk@B/mimxrt1062/qspi
    integration_platforms:
      - native_sim/native/64
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "controller composition=zephyr init=0"
        - "CONTROLLER_COMPLETE cycles=20"
