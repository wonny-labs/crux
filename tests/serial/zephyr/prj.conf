CONFIG_ZTEST=y
CONFIG_CRUX_TIME=n
CONFIG_CRUX_SERIAL=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_TEST_EXTRA_STACK_SIZE=2048
CONFIG_IRQ_OFFLOAD=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
# The test wraps the device in a proxy whose API table is not in the linker section that
# Zephyr v4.5.0 checks with CONFIG_DEVICE_API_ASSERT.
CONFIG_DEVICE_API_ASSERT=n
