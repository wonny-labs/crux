# As psa-mbedtls-psa-c.conf, and the entropy driver switched on explicitly, in case the PSA core needs a
# random source that the board's default configuration does not enable for the bootloader.
# Added to the MCUboot image only, after the four board files of the composition.
CONFIG_BOOT_ECDSA_PSA=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y
