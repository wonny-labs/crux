# MCUboot's ECDSA P-256 implementation "Use mbedTLS" (BOOT_ECDSA_MBEDTLS) of the choice
# BOOT_ECDSA_IMPLEMENTATION in boot/zephyr/Kconfig at MCUboot 6d3b3d2c. Tinycrypt is the default of
# that choice, so the composition check builds without a line of this kind. Added to the MCUboot image
# only, after the four board files of the composition.
CONFIG_BOOT_ECDSA_MBEDTLS=y
