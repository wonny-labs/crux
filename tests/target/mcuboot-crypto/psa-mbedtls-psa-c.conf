# The PSA backend with Zephyr's Mbed TLS module and its PSA crypto core switched on. The second build,
# with psa-mbedtls.conf, configured and then failed to compile the Mbed TLS library ("unknown type name
# 'mbedtls_error_pair_t'" in library/ssl_misc.h). MCUboot's BOOT_ECDSA_PSA selects PSA_CRYPTO_C of Zephyr's
# PSA Kconfig and not MBEDTLS_PSA_CRYPTO_C of modules/mbedtls/Kconfig.tf-psa-crypto. Added to the MCUboot
# image only, after the four board files of the composition.
CONFIG_BOOT_ECDSA_PSA=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
