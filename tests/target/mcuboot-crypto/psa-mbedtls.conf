# The PSA backend (BOOT_ECDSA_PSA) with Zephyr's Mbed TLS module switched on. The first build with psa.conf
# alone failed with "psa/crypto.h: No such file or directory": Zephyr's modules/mbedtls/CMakeLists.txt at
# v4.4.2 adds the TF-PSA-Crypto include directories only when CONFIG_MBEDTLS is set, and BOOT_ECDSA_PSA
# does not select it. Added to the MCUboot image only, after the four board files of the composition.
CONFIG_BOOT_ECDSA_PSA=y
CONFIG_MBEDTLS=y
