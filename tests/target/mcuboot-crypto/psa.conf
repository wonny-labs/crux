# MCUboot's ECDSA P-256 implementation "Use PSA crypto" (BOOT_ECDSA_PSA) of the choice
# BOOT_ECDSA_IMPLEMENTATION in boot/zephyr/Kconfig at MCUboot 6d3b3d2c. Added to the MCUboot image only,
# after the four board files of the composition. No other symbol is set: what the build then needs in
# addition (an entropy source, a heap size) is a result of the comparison, not an input.
CONFIG_BOOT_ECDSA_PSA=y
