# Board test image: Crux microSD interrupted-write test (link only). Not a sample (docs/plans/samples-layout-proposal.md, section 5).
common:
  build_only: true
  platform_allow: [mimxrt1060_evk@B/mimxrt1062/qspi]
  tags: [filesystem, crux, link_only]
tests:
  crux.file.sd_card_power_cut_append:
    extra_args: []
  crux.file.sd_card_power_cut_append.test:
    extra_configs:
      - CONFIG_SAMPLE_SD_INTERRUPT_TEST=y
