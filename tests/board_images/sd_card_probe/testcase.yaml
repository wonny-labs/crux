# Board test image: Crux microSD physical-gate probes (link only). Not a sample (docs/plans/samples-layout-proposal.md, section 5).
common:
  build_only: true
  platform_allow: [mimxrt1060_evk@B/mimxrt1062/qspi]
  tags: [filesystem, crux, link_only]
tests:
  crux.file.sd_card_probe:
    extra_args: []
  crux.file.sd_card_probe.stack:
    extra_configs:
      - CONFIG_SAMPLE_SD_STACK_PROBE=y
  crux.file.sd_card_probe.removal:
    extra_configs:
      - CONFIG_SAMPLE_SD_REMOVAL_PROBE=y
