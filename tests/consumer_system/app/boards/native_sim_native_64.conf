# The native_sim fragment of the product (ADR-0005 section 3): the three native facilities that System
# composes on, and the simulated watchdog, an Experimental native_sim test setting. The symbol is refused at
# configure time on every other board. A simulated watchdog is not hardware evidence.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_CRUX_SYSTEM_NATIVE_SIM_WATCHDOG=y
