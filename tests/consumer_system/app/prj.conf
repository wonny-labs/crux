# The product's configuration (ADR-0005 T3). The Crux symbol is CRUX_SYSTEM. What it composes on, and the
# simulated watchdog, are in boards/native_sim_native_64.conf, because they hold on native_sim only.
CONFIG_STD_C17=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BOOT_BANNER=n
# Time defaults on where an RTC exists, as on native_sim. This product does not use it.
CONFIG_CRUX_TIME=n
CONFIG_CRUX_SYSTEM=y
