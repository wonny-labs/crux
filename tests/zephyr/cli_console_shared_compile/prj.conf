# RT1060-EVKB, compile and link only: see CMakeLists.txt. The PSA provider comes from the files that run.sh
# names in EXTRA_CONF_FILE, and the shared console mode from tests/native/cli_console/shared/shared.conf.
CONFIG_STD_C17=y
CONFIG_CRUX_MODULE=y
CONFIG_PSA_CRYPTO=y
# The locks of the Mbed profile's core, from the module (Experimental).
CONFIG_CRUX_PSA_THREADING=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SHELL=n

# The console, with Access and its first-account setup.
CONFIG_CRUX_ACCESS=y
CONFIG_CRUX_SERIAL=y
CONFIG_CRUX_CLI=y
CONFIG_CRUX_CLI_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Crux Logging. The board turns Zephyr's UART console on, which would own the console's UART, so it is off here
# and printk goes through Logging.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y
CONFIG_CRUX_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_BACKEND_SHOW_LEVEL=y

# Entropy from the i.MX RT TRNG through its driver, and the device ID of the credential store.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y

# A File provider, which Access needs: FatFs on a RAM disk (app.overlay), with no card driver in the image.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_CRUX_FILE_FATFS_RAM_DISK=y
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_IMX_USDHC=n
