# LittleFS over a block device, the free file system on which the Settings File selection
# CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE_ANY_FS is proven. With a block device each read, program
# and cache unit is one 512-byte sector, so a metadata block is one sector.
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_FMP_DEV=n
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
