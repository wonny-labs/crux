# The Settings File backend on LittleFS, for the W4 workload. Added to littlefs.conf:
# -DEXTRA_CONF_FILE="littlefs.conf;settings_littlefs.conf". The selection is the one that does not
# depend on Reliance Edge, and it stages the same corrected backend as settings.conf. A low line limit
# makes a save often compact the file, which is the sequence W4 cuts.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/MMC:/settings/cfg"
CONFIG_SETTINGS_FILE_MAX_LINES=6
CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE_ANY_FS=y
