# The Crux File provider on FatFs, for the W8 and W8C workloads, recorded as observations. Added to
# fatfs.conf with the devicetree overlay fatfs-file.overlay:
# -DEXTRA_CONF_FILE="fatfs.conf;fatfs-file.conf" -DEXTRA_DTC_OVERLAY_FILE=fatfs-file.overlay.
# The FatFs simulator selection depends on a RAM disk or a flash disk driver. The overlay adds a small
# RAM disk to satisfy that dependency; nothing mounts it, and the workloads bind File on /MMC:.
CONFIG_CRUX_FILE_FATFS_SIMULATOR=y
CONFIG_DISK_DRIVER_RAM=y
