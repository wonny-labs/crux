# The Crux File provider on LittleFS over a block device, for the W5, W8 and W8C workloads. Added to
# littlefs.conf: -DEXTRA_CONF_FILE="littlefs.conf;littlefs-file.conf". The workloads bind root 0 on
# the replay's mount. A directory entry must be longer than a File name (64, over littlefs.conf's 63).
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=64
CONFIG_CRUX_FILE_LITTLEFS_BLK_DEV=y
