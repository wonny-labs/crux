CONFIG_ZTEST=y
# Zephyr's errno values, as in the Reliance Edge suite.
CONFIG_MINIMAL_LIBC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
# LittleFS on a block device only. With a block device each read, program and cache unit is one
# sector, so the cache is one sector.
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_FMP_DEV=n
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/MMC:/settings/cfg"
CONFIG_SETTINGS_FILE_MAX_LINES=100
# The target provider under test, on the file system that the composition mounts, with the
# corrected backend that it stages.
CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE_ANY_FS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192
