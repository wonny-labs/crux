CONFIG_ZTEST=y
# Zephyr's errno values, as in the Settings File suites.
CONFIG_MINIMAL_LIBC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
# One byte more than a File name, so that a longer name is cut to a length that is not one.
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=64
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_FMP_DEV=n
# The File pool of 4 and the two files that the Settings File backend can hold during a save. The
# cache size is not set here: the selection defaults it to one 512-byte sector.
CONFIG_FS_LITTLEFS_NUM_FILES=6
CONFIG_CRUX_FILE_LITTLEFS_BLK_DEV=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings/cfg"
CONFIG_SETTINGS_FILE_MAX_LINES=100
CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE_ANY_FS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192
