# Configuration of scripts/tidy-sources.py: which builds give the clang-tidy source list.
# Fields are separated by `;`. A `#` starts a comment. Paths are relative to the repository root.
#
#   build ; <dir>                  analyse every source under components/, samples/, tests/ and web/ that
#                                  the compile database of <dir> names. When a source is in several
#                                  databases, the first listed build wins and the source is analysed once.
#   ignore-build ; <glob> ; <why>  a build directory with a compile database that is deliberately not
#                                  analysed. A database that is neither listed nor ignored fails the check
#                                  in CI, so no compiled source can silently fall out of every list.
#   exclude ; <source> ; <why>     one compiled source that is not analysed. One explicit path, no pattern,
#                                  and a reason. The reason is required; in --strict mode an exclusion
#                                  that no listed build compiles fails, so a stale line cannot stay.
#
# Adding a source needs no line here: a listed build that compiles it is enough. Adding a CI build
# directory that holds a database needs one `build` or `ignore-build` line.

# The primary preset build. analyze-host.sh moves the sanitize build first when it runs with
# CRUX_HOST_PRESET=host-sanitize.
build ; build/linux/debug
build ; build/linux/sanitize

# Standalone consumer builds of the host job: each compiles the sources of one public consumer.
# Only builds that exist when `analyze-host.sh` runs in the host job are listed, because --strict fails
# on a listed build that is missing. CI log of 2026-11-15: build/file-consumers, logging-consumer,
# system-consumer, thread-only, sync-only, execution-firmware-host and execution-runtime-host.
build ; build/file-consumers
build ; build/logging-consumer
build ; build/system-consumer
build ; build/thread-only
build ; build/sync-only
build ; build/execution-firmware-host
build ; build/execution-runtime-host

# Builds that the host job may produce but that must not be analysed.
ignore-build ; build/clangd ; a copy of the compile database of the preset build that scripts/select-clangd-database.sh selected, for clangd, so every source in it is already listed
ignore-build ; build/*-boundary ; the boundary checks compile probe sources that must fail to compile
ignore-build ; build/zephyr/* ; Zephyr and native_sim builds need the west workspace and an ARM-aware setup, so they need a separate design (stage 4 of docs/static-analysis-coverage.md)

# Sources that a listed build compiles but clang-tidy must not analyse.
exclude ; tests/reboot/probe/nodiscard_probe.c ; deliberate probe: it discards a [[nodiscard]] result so the build must fail to compile (EXCLUDE_FROM_ALL in tests/reboot/CMakeLists.txt)
