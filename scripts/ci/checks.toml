run = "./scripts/test-messaging.sh --host-only"
fast = ["messaging", "execution"]

[[check]]
id = "format"
job = "host"
run = "./scripts/check-format.sh"
fast = "always"

[[check]]
id = "serial-host"
job = "host"
run = "./scripts/test-serial.sh --host-only"
fast = ["serial"]

[[check]]
id = "logging-host"
job = "host"
run = "./scripts/test-logging.sh --host-only"
fast = ["logging"]

[[check]]
id = "system-host"
job = "host"
run = "./scripts/test-system.sh --host-only"
fast = ["system"]

[[check]]
id = "static-analysis"
job = "host"
run = "./scripts/analyze-host.sh"
fast = "always"

[[check]]
id = "build-boundaries"
job = "host"
run = "./scripts/check-dependencies.sh"
fast = "always"

# --- host-build-tests ---------------------------------------------------------------------------
# CLANG_TIDY lets the product style check run the real tool on a small source.

[[check]]
id = "build-tests"
job = "host-build-tests"
run = "CLANG_TIDY=clang-tidy-18 python3 scripts/ci/run_unittests.py -s tests/build --exclude-from scripts/ci/large-tests.txt"
scope = "always"
fast = "always"

[[check]]
id = "build-tests-large"
job = "host-build-tests"
run = "CLANG_TIDY=clang-tidy-18 python3 scripts/ci/run_unittests.py -s tests/build --only-from scripts/ci/large-tests.txt"
scope = "always"
fast = ["repository-tests"]

[[check]]
id = "power-cut-wrapper"
job = "host-build-tests"
run = "python3 -m unittest discover -s tests/power_cut -v"
fast = "always"

