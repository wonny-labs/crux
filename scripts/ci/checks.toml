python3 -m unittest discover -s tests/style -p 'test_patch_style.py' -v
scripts/ci/check-patch-range.sh
"""
fast = "always"

[[check]]
id = "storage-simulators"
job = "zephyr-storage"
scope = "not-docs"
run = "scripts/test-storage-simulators.sh"
fast = ["file"]

[[check]]
id = "file-rt1060-compile"
job = "zephyr-storage"
scope = "not-docs"
run = "scripts/test-file-rt1060-compile.sh"
fast = ["file"]

# Uses the already-fetched pinned sources and host C compiler.
[[check]]
id = "flash-poc-fault-paths"
job = "zephyr-storage"
scope = "not-docs"
run = "ZEPHYR_BASE=\"$CRUX_WORKSPACE/zephyr\" python3 tests/native/flash_safety/test_driver.py"

[[check]]
id = "zephyr-time-evkb"
job = "zephyr-storage"
scope = "not-docs"
run = "scripts/test-zephyr-time.sh \"$CRUX_BOARD_TARGET\""

[[check]]
id = "product-template"
job = "zephyr-storage"
scope = "not-docs"
run = "scripts/test-product-template.sh \"$CRUX_BOARD_TARGET\""

# The GPLv2 Reliance Edge source is the optional west group crux-reliance, which
# bootstrap-zephyr.sh does not enable, so this check enables the group itself. It is the last
# storage check, so that no earlier check runs with the group enabled. Images that link the source
# are test images: nothing here is uploaded as a named zephyr.elf or zephyr.bin, and the link
# check writes outside the twister-* directories that the evidence collection matches.
[[check]]
id = "emmc-reliance-edge"
job = "zephyr-storage"
scope = "not-docs"
run = """
(cd "$CRUX_WORKSPACE" && west config manifest.group-filter -- +crux-reliance && west update reliance-edge)
CRUX_STORAGE_32BIT=1 scripts/test-storage-emmc.sh
scripts/test-file-emmc-compile.sh
"""

