# The CI checks of Crux and the rules that pick them for each tier.
# docs/ci.md is the reference for this file; scripts/ci/run-tier.sh reads it.
#
# Every check runs from the repository root with `bash -eo pipefail -c <run>`. Within a job the
# checks run in the order written here, and the first failing check stops the job.
# tests/build/test_ci_tiers.py holds the list of check ids: removing a check fails that test.

version = 1

[selection]
# A change whose every file matches these is documentation only.
docs = ["docs/**", "**.md"]
# A fast run falls back to the full tier when a changed file matches one of these: build, CI,
# script and shared configuration files, the Zephyr module root, Kconfig files anywhere, and the
# components that every other component builds on.
escalate = [
  ".github/**",
  ".devcontainer/**",
  "Jenkinsfile",
  "scripts/**",
  "cmake/**",
  "CMakeLists.txt",
  "CMakePresets.json",
  ".clang-format",
  ".clang-tidy",
  ".clangd",
  ".gitattributes",
  ".gitignore",
  "doc-links.toml",
  "lychee.toml",
  "west.yml",
  "patches/**",
  "zephyr/**",
  "**/Kconfig*",
  "**/*.conf",
  "**/*.overlay",
  "tools/**",
  "templates/**",
  "samples/boards/**",
  "components/base/**",
  "components/interrupt/**",
  "components/sync/**",
  "components/thread/**",
  "components/time/**",
]
# A fast run falls back to the full tier when the change touches more components than this.
max_components = 3

# Each component lists the paths that belong to it. A changed file outside every component and
# outside the documentation makes a fast run fall back to the full tier.
[components]
access = ["components/access/**", "tests/access/**", "tests/access_consumer/**"]
cli = [
  "components/cli/**",
  "tests/cli/**",
  "tests/cli_consumer/**",
  "tests/ssh/cli/**",
  "tests/zephyr/cli_serial_compile/**",
  "tests/native/cli_console/**",
]
controller = [
  "tests/controller/**",
  "tests/controller_integrated/**",
  "tests/controller_m3/**",
  "tests/controller_network/**",
  "tests/controller_network_stack/**",
  "tests/m5_integrated/**",
]
credential = ["components/credential/**", "tests/credential/**", "tests/credential_consumer/**"]
execution = [
  "tests/execution/**",
  "tests/execution_firmware/**",
  "tests/execution_runtime/**",
  "tests/portable_execution/**",
]
file = ["components/file/**", "tests/file/**", "tests/file_consumer/**"]
file-service = ["components/file_service/**", "tests/file_service/**", "tests/file_service_consumer/**"]
gpio = ["components/gpio/**", "tests/gpio/**"]
i2c = ["components/i2c/**", "tests/i2c/**", "tests/i2c_consumer_zephyr/**", "tests/i2c_zephyr/**"]
logging = ["components/logging/**", "tests/logging/**", "tests/logging_consumer/**"]
messaging = ["tests/messaging_consumer/**"]
mgmt-services = [
  "components/config_service/**",
  "components/mgmt_status/**",
  "tests/config_service/**",
  "tests/mgmt_status/**",
  "tests/mgmt_services_consumer/**",
  "tests/native/mgmt_services/**",
]
networking = [
  "components/netif/**",
  "components/sockets/**",
  "tests/networking/**",
  "tests/networking_consumer/**",
  "tests/networking_zephyr/**",
  "tests/networking_physical/**",
  "tests/networking_physical_native/**",
  "tests/native/tcp_isn/**",
]
reboot = ["components/reboot/**", "tests/reboot/**"]
repository-tests = ["tests/build/**", "tests/power_cut/**", "tests/docs/**", "tests/style/**"]
security-event = [
  "components/security_event/**",
  "tests/security_event/**",
  "tests/security_event_consumer/**",
]
serial = ["components/serial/**", "tests/serial/**", "tests/serial_consumer/**"]
spi = ["components/spi/**", "tests/spi/**", "tests/spi_consumer_zephyr/**", "tests/spi_zephyr/**"]
system = ["components/system/**", "tests/system/**", "tests/system_consumer/**"]
web = [
  "components/web/**",
  "tests/web/**",
  "tests/web_consumer/**",
  "tests/native/web_http/**",
  "tests/native/web_assets/**",
  "tests/zephyr/web_compile/**",
]
web-ui = ["web/**", "samples/web/**", "tests/management_api/**"]

# Scopes name the changes that a check needs in the full tier:
#   code    (the default) every change, except one that is documentation only while it is
#           developed (a change request, a branch build or a local run); after a merge it runs
#   always  every change, documentation only included
#   a name  a list below: path patterns, on every event; a later pattern starting with ! removes
#           earlier matches
# With no known change (a manual or nightly run) every check runs.
[scopes]
# The workflow filter of the Zephyr jobs: documentation alone never starts them.
not-docs = ["**", "!docs/**", "!**.md"]
psa-crypto = ["**", "!docs/**", "!**.md", "docs/dependency-review-*.md"]
web-ui = [
  "web/**",
  "samples/web/**",
  "tests/management_api/**",
  "scripts/check-management-api.sh",
  "scripts/ci/**",
  ".github/workflows/web.yml",
]

[jobs.host]
description = "Linux Host builds, unit tests, sanitizers, static analysis and boundaries"
[jobs.host-build-tests]
description = "The Python checks of the build, validation and CI tooling"
# The Zephyr jobs build for the board in CRUX_BOARD_TARGET (scripts/lib/board.sh,
# tests/README.md#board-input); a CI system or a developer may set another.
[jobs.zephyr-storage]
description = "Zephyr storage, File, Time and product template checks"
env = { CRUX_BOARD_TARGET = "mimxrt1060_evk@B//qspi" }
[jobs.zephyr-controller]
description = "Zephyr smoke builds, execution candidates and controller checks"
env = { CRUX_BOARD_TARGET = "mimxrt1060_evk@B//qspi" }
[jobs.zephyr-runtime]
description = "Zephyr portable execution, messaging, Logging, System and boot composition"
env = { CRUX_BOARD_TARGET = "mimxrt1060_evk@B//qspi" }
[jobs.zephyr-io]
description = "Zephyr Serial, command line, GPIO, I2C, SPI, web and networking"
env = { CRUX_BOARD_TARGET = "mimxrt1060_evk@B//qspi" }
[jobs.psa-crypto]
description = "TF-PSA-Crypto and the Mbed TLS management composition"
[jobs.web-specification]
description = "The management API specification lint"
[jobs.web-client]
description = "The web client checks, audit and SBOM"
[jobs.web-browser]
description = "The web browser tests on the mock"
[jobs.web-angular]
description = "The Angular sample and the shared browser cases"
env = { CRUX_REQUIRE_ANGULAR = "1" }
[jobs.docs]
description = "Documentation link and anchor checks"
[jobs.coverage-host]
description = "Advisory Host coverage"
[jobs.coverage-native-sim]
description = "Advisory native_sim coverage"

